version: '3.8'

services:
  # Python ML API
  ml-api:
    build:
      context: ../
      dockerfile: deployment/ml-api.Dockerfile
    container_name: dental-ai-ml
    ports:
      - "5000:5000"
    environment:
      - PYTHONPATH=/app
      - MODEL_PATH=/app/models/weights
      - CUDA_VISIBLE_DEVICES=0
    volumes:
      - ./models/weights:/app/models/weights:ro
      - ./data:/app/data:ro
    networks:
      - dental-ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Node.js Backend API
  backend-api:
    build:
      context: ../
      dockerfile: deployment/backend.Dockerfile
    container_name: dental-ai-backend
    ports:
      - "5001:5001"
    environment:
      - NODE_ENV=production
      - PORT=5001
      - ML_API_URL=http://ml-api:5000
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/dental_ai
    depends_on:
      - ml-api
      - redis
      - postgres
    networks:
      - dental-ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/api/ai/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # React Frontend
  frontend:
    build:
      context: ../
      dockerfile: deployment/frontend.Dockerfile
    container_name: dental-ai-frontend
    ports:
      - "8080:80"
    environment:
      - REACT_APP_API_URL=http://localhost:5001
      - REACT_APP_VERSION=2.0.0
    depends_on:
      - backend-api
    networks:
      - dental-ai-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: dental-ai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - dental-ai-network

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: dental-ai-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=dental_ai
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - dental-ai-network

  # FAISS Vector Database (for similar cases)
  faiss:
    build:
      context: ../
      dockerfile: deployment/faiss.Dockerfile
    container_name: dental-ai-faiss
    ports:
      - "5002:5002"
    volumes:
      - ./data/faiss_index:/app/index:ro
    networks:
      - dental-ai-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: dental-ai-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend-api
    networks:
      - dental-ai-network

  # Monitoring - Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: dental-ai-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - dental-ai-network

  # Monitoring - Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: dental-ai-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana-dashboards:/etc/grafana/provisioning/dashboards:ro
    networks:
      - dental-ai-network

volumes:
  redis-data:
  postgres-data:
  prometheus-data:
  grafana-data:

networks:
  dental-ai-network:
    driver: bridge
